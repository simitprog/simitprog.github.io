<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Studenti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Gestione Studenti</h2>
            </div>
            <div class="card-body">
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <input type="text" id="nome" class="form-control" placeholder="Nome">
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="cognome" class="form-control" placeholder="Cognome">
                    </div>
                    <div class="col-md-2">
                        <input type="number" id="eta" class="form-control" placeholder="Età">
                    </div>
                    <div class="col-md-2">
                        <button id="btnAggiungi" class="btn btn-success w-100">Aggiungi</button>
                    </div>
                </div>

                <table class="table table-striped border">
                    <thead class="table-dark">
                        <tr>
                            <th>Nome</th>
                            <th>Cognome</th>
                            <th>Età</th>
                            <th>Azione</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabella">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
